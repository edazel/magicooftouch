name = "magic-touch"
main = "worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "magic-touch"
database_id = "870cb5f3-b361-4c0e-8f43-9eb56ec48cdf"
migrations_dir = "migrations"

[triggers]
crons = ["0 * * * *"]
